# recon.transaction_match 策略 v1.0（定稿 §2.2.1 first-match-wins + §2.2.6 风险分级）
#
# 语义：
#   - REVIEW 是策略动作，不是模型标签（§1.3.4）。模型只出三态 + 校准概率；
#     "结构复杂 / 证据不足 / 超金额 / 主体不符" 由下面的硬规则路由 REVIEW。
#   - first-match-wins：规则按顺序命中，硬规则（结构/主体/金额）排在模型分数规则之前，
#     优先级永远高于模型分数（§2.2.1）。
#   - 一期 AUTO 只开放"低风险 + 低金额 + 高置信 + 硬规则全过"的交集（§2.2.6 / D5）。
#   - 阈值/金额上限为**定稿示例值**，D5 决策会书面确认后改这里的数字即可（不改代码）。
#   - 求值走 strategy.py 的受限 AST（§7-A）：只许比较/布尔 + 白名单 f.* / calib.* / payment.*，
#     禁止 eval / 属性链逃逸 / 算术 / 下标。
#
# 变量域：
#   f.*        特征（build_features 输出）
#   calib.*    matched/partial/unmatched（校准概率）、label（预测三态）、conf（最大概率）
#   payment.*  amount / currency / channel / payer_id

policy:
  id: recon.transaction_match
  version: "1.0"
  default_action: REVIEW          # 无规则命中 → 保守落 REVIEW

rules:
  # ---- 硬规则 1：结构 flag（一期显式排除，§1.3.4 / R3） ----
  - name: struct_multi_mapping
    when: "f.is_multi_mapping > 0"
    action: REVIEW
    reason: "多对多结构（一期排除），路由人工"

  - name: struct_split_merge
    when: "f.has_split_merge > 0"
    action: REVIEW
    reason: "拆分/合并结构（一期排除），路由人工"

  - name: struct_currency_mismatch
    when: "f.currency_mismatch > 0"
    action: REVIEW
    reason: "跨币种（一期排除），路由人工"

  # ---- 硬规则 2：主体不一致 ----
  - name: supplier_mismatch
    when: "f.supplier_exact_match == 0"
    action: REVIEW
    reason: "付款主体与发票主体不一致，路由人工"

  # ---- 硬规则 3：金额上限（一期 AUTO 只低金额，§2.2.6） ----
  - name: amount_above_cap
    when: "payment.amount > 100000"
    action: REVIEW
    reason: "超一期 AUTO 金额上限（示例 100k），路由人工"

  # ---- 模型分数规则：高置信 MATCHED → AUTO ----
  - name: auto_matched_high_conf
    when: "calib.label == 'MATCHED' and calib.conf >= 0.9 and calib.matched >= 0.9 and payment.amount <= 100000"
    action: AUTO
    reason: "高置信匹配 + 低风险 + 低金额，自动核销"

  # 其余（PARTIAL / UNMATCHED / 低置信 MATCHED）→ 落 default REVIEW
